############################################################################

### Main output directory
output_dir: "results"

### Add path to directory of files of interest
data_dir: "data"

### Conda environment YAML paths
envs:
  cavicor: "../envs/cavicor.yaml"
  chopper: "../envs/chopper.yaml"
  nanostat: "../envs/nanostat.yaml"
  vsearch: "../envs/vsearch.yaml"
  minimap2: "../envs/minimap2.yaml"
  samtools: "../envs/samtools.yaml"
  blast: "../envs/blast.yaml"
  r_rarefaction: "../envs/r_rarefaction.yaml"
  taxonkit: "../envs/taxonkit.yaml"
  multiqc: "../envs/multiqc.yaml"
  ncbi_download: "../envs/ncbi_download.yaml"
  mafft: "../envs/mafft.yaml"
  fasttree: "../envs/fasttree.yaml"
  trimal: "../envs/trimal.yaml"

### Analysis Modules
modules:
  12s_diversity: false # BLAST diversity of samples
  quality_control: false # Data quality control
  phylogeny: false # Phylogenetic analysis of samples
  build_db_phylo_only: true # Build reference database for phylogeny only

### resources
# Diamond DB to download
blast:
  - "resources/blast/" 
# Logos
logo_dirs: 
  - "resources/logo/"

