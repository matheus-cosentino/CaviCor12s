########### BLAST ############
#Homology Search with blast
blast:
  perc_identity: 
    - 70
    #- 80
    #- 90
    #- 95 
    #- 99
  evalue:
#    - 0.01    
    #- 0.001
    - 0.00001
#    - 0.000001
#    - 0.0000001
#    - 0.00000001
  max_target_seqs:
     #- 1
    - 5
    #- 10
#    - 15
    #- 20
#    - 30
#    - 50
 
########### VSEARCH ############
#Removing redundancy within reads, keeping only representantives by identity treshold
vsearch:
  identity:
    #- 0.99
    - 0.95
    #- 0.9
    #- 0.85
    #- 0.8
    #- 0.7
  minsize:
    #- 2
    - 5
    #- 10
    #- 20
    #- 50
    #- 100
    #- 150
    #- 200


########### CHOPPER ############
# Quality filtering of ONP data
chopper:
  min_quality: 
    - 10
  min_length: 
    - 400
  max_length: 
    - 800

########### PHYLO ############
# Further exploring diversity by phyllogenetic group, just add TaxID of group of interest
phylo_target:
  #- 9397 #chiroptera 
  - 40674 #mammals
  - 9398 #Pteropodidae

# Mapping between TaxID and taxon names for file extraction
phylo_names:
  40674: "Mammalia"
  9397: "Chiroptera"
  9398: "Pteropodidae"

# Mitocondrial Genes to build phylogenetic trees Databases within Fastas
phylo_genes:
  - "12s" #12s_Human
  #- "MTCYB" #MTCYB_Human

